workflows:
  android-workflow:
    name: DD-Kitchen Android Debug
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.ddkitchen.app"

    scripts:
      - name: Set Android SDK location
        script: 'echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"'

      - name: Generate Gradle Wrapper
        script: 'gradle wrapper --gradle-version 8.14.1 && chmod +x gradlew'

      - name: Build DD Kitchen Debug APK
        script: './gradlew clean assembleDebug --stacktrace'

    artifacts:
      - 'app/build/outputs/apk/debug/app-debug.apk'

  dd-kitchen-release:
    name: DD-Kitchen Signed Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - dd-kitchen-upload
      vars:
        PACKAGE_NAME: "com.ddkitchen.app"
      groups:
        - dd-kitchen-secrets

    scripts:
      - name: Set Android SDK location
        script: 'echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"'

      - name: Generate Gradle Wrapper
        script: 'gradle wrapper --gradle-version 8.14.1 && chmod +x gradlew'

      - name: Build signed Android App Bundle
        script: |
          ./gradlew clean bundleRelease --stacktrace

    artifacts:
      - 'app/build/outputs/bundle/release/*.aab'
      - 'app/build/outputs/mapping/release/mapping.txt'
